<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2747">
<title>Ledgerline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Michroma&family=Share+Tech+Mono&display=swap">
<style>
/* Ledgerline, a Commonweal civic service. A phone app in Commonweal livery: civic white, registry navy,
   STR teal. Full screen on phones; on a desktop it sits in a handheld frame. Gigs live in gigs.js.
   Screens: Gigs (home), My gigs, Wallet, Profile, plus the gig detail sheet. Routing: #LL-xxxx opens a gig,
   #mine / #wallet / #me pick a tab. */
:root{
  --bg:#eef2f7; --card:#fff; --ink:#0d1b2e; --sub:#5a6a82; --faint:#94a1b5; --line:#e1e7ef; --line-2:#cdd6e2;
  --navy:#0f2747; --navy-2:#173a66; --teal:#0b9e8f; --teal-2:#08786d; --teal-soft:#e0f5f2; --mint:#6ff3e0;
  --star:#e8a317; --warn:#a85f00; --warn-bg:#fff4e2; --warn-line:#f3d29e; --haz:#c8323f; --ok:#1d8a4e; --ok-bg:#e5f6ec;
  --f-ui:"Exo 2","Segoe UI",system-ui,sans-serif; --f-mark:"Michroma","Eurostile",sans-serif; --f-mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font:400 15px/1.45 var(--f-ui);color:var(--ink);background:#0a1426}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* the app shell: full screen on phones, a handheld frame on big screens */
.app{position:relative;height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.sbar{display:none}
@media (min-width:700px) and (min-height:640px){
  body{display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1a3358,#0a1426 70%)}
  .app{width:410px;height:min(880px,calc(100dvh - 48px));border-radius:38px;border:10px solid #050b16;box-shadow:0 0 0 1px #2a3b5c,0 30px 80px rgba(0,0,0,.6)}
  .sbar{display:flex;justify-content:space-between;align-items:center;padding:8px 22px 2px;background:var(--navy);color:#cfe0f5;font:600 12px var(--f-ui)}
  .sbar .cw{font:400 9px var(--f-mono);letter-spacing:.14em;opacity:.7}
}

/* brand bar */
.appbar{background:var(--navy);color:#fff;padding:10px 16px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px}
.seal{width:34px;height:34px;flex:none}
.brand .wm{font:400 14px var(--f-mark);letter-spacing:.16em;line-height:1.1}
.brand .by{font:500 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#8fb0d8}
.brand .sp{flex:1}
.bal{text-align:right;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.08)}
.bal small{display:block;font:500 9.5px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:#8fb0d8}
.bal b{font:600 14px var(--f-ui);color:var(--mint)}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 12px;border-radius:12px;background:#fff;color:var(--sub)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink);min-width:0}
.guest{display:flex;align-items:center;gap:6px;margin-top:10px;font:500 11.5px var(--f-ui);color:#ffd18a}
.guest b{padding:1px 7px;border-radius:999px;background:rgba(255,209,138,.15);font-weight:600;letter-spacing:.06em;font-size:10.5px}
.title-only .search,.title-only .guest{display:none}
.scrtitle{display:none;margin-top:10px;font:700 22px var(--f-ui)}
.title-only .scrtitle{display:block}

.scroll{flex:1;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:20px}
.scroll::-webkit-scrollbar{display:none}
.screen[hidden]{display:none}
.pad{padding:0 16px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);font:600 13px var(--f-ui);color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.sect{display:flex;justify-content:space-between;align-items:baseline;padding:18px 16px 8px}
.sect h2{margin:0;font:700 16px var(--f-ui)}
.sect span{font:500 12px var(--f-ui);color:var(--faint)}
.sect select{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:3px 6px;font:500 12px var(--f-ui);color:var(--sub)}

/* hero: matched gig */
.hero{display:block;width:calc(100% - 32px);margin:14px 16px 0;text-align:left;padding:16px;border-radius:18px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 80% 90% at 100% 0%,rgba(111,243,224,.35),transparent 60%),linear-gradient(140deg,var(--navy-2),var(--navy))}
.hero .eb{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(111,243,224,.18);color:var(--mint);font:600 10.5px var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.hero h3{margin:10px 0 4px;font:700 19px/1.25 var(--f-ui)}
.hero .cl{font:500 12.5px var(--f-ui);color:#a9c2e2}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;gap:10px}
.hero .amt{font:700 28px/1 var(--f-ui);color:#fff}
.hero .amt small{display:block;margin-top:4px;font:600 12px var(--f-ui);color:var(--mint)}
.hero .go{padding:9px 16px;border-radius:12px;background:var(--mint);color:var(--navy);font:700 13px var(--f-ui)}
.hero .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hero .tags span{padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.1);font:500 11px var(--f-ui);color:#cfe0f5}

/* gig rows */
.list{margin:0 16px;background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.gig{display:grid;grid-template-columns:42px 1fr auto;gap:2px 12px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);align-items:start}
.gig:last-child{border-bottom:0}
.gig:active{background:#f5f8fb}
.gig .ic{grid-row:span 3;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-2)}
.gig .t{font:600 15px/1.3 var(--f-ui)}
.gig .p{text-align:right;font:700 15px var(--f-ui);color:var(--teal-2);white-space:nowrap}
.gig .p small{display:block;font:500 11px var(--f-ui);color:var(--faint)}
.gig .c{grid-column:2/4;font:500 12.5px var(--f-ui);color:var(--sub);display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.gig .m{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;background:#f1f4f8;font:500 11.5px var(--f-ui);color:var(--sub)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.lock{background:#fbf3df;color:#8a6200}
.st{color:var(--star);letter-spacing:.5px}
.st .o{color:#d6dce6}
.gig.locked .ic{background:#fbf3df;color:#8a6200}
.gig.locked .p{color:#8a6200;filter:blur(4px)}
.gig.dead{opacity:.55}
.gig.dead .p{color:var(--faint);text-decoration:line-through}
.empty{margin:0 16px;padding:28px 18px;text-align:center;color:var(--sub);background:var(--card);border:1px dashed var(--line-2);border-radius:16px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* segmented control */
.seg{display:flex;margin:14px 16px 0;padding:3px;border-radius:12px;background:#e2e8f0}
.seg button{flex:1;padding:7px;border-radius:9px;font:600 13px var(--f-ui);color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(13,27,46,.12)}

/* wallet */
.wcard{margin:14px 16px 0;padding:18px;border-radius:18px;color:#fff;background:linear-gradient(140deg,var(--teal-2),var(--navy) 80%)}
.wcard small{font:600 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:#bfe9e3}
.wcard .big{font:700 34px/1.1 var(--f-ui);margin:4px 0 14px}
.wcard .num{font:400 12px var(--f-mono);letter-spacing:.12em;color:#bfe9e3}
.panel{margin:12px 16px 0;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.panel h3{margin:0 0 2px;font:700 15px var(--f-ui)}
.panel p{margin:0;color:var(--sub);font-size:13px}
.prog{height:8px;border-radius:4px;background:#e6ebf2;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.prog.gold i{background:var(--star)}
.prog.ms{position:relative;overflow:visible}
.prog.ms b{position:absolute;top:-3px;width:2px;height:14px;margin-left:-1px;background:var(--line-2);border-radius:1px}
.mil{margin-top:12px}
.mil div{display:flex;justify-content:space-between;padding:5px 0;font:500 13px var(--f-ui);color:var(--sub);border-top:1px solid var(--line)}
.mil div:first-child{border-top:0}
.mil .hit{color:var(--ok);font-weight:600}
.panel.ad{background:linear-gradient(140deg,#f6f9fd,#eaf1fa);border-color:var(--line-2)}
.spon{display:block;margin-bottom:4px;font:600 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.pl{display:flex;justify-content:space-between;font:500 12px var(--f-ui);color:var(--sub)}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:0 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok)}
.tx .t{font:600 14px var(--f-ui)}
.tx .d{font:500 12px var(--f-ui);color:var(--faint)}
.tx .a{font:700 14px var(--f-ui);color:var(--ok);text-align:right}
.tx .a small{display:block;font:500 11px var(--f-ui);color:var(--haz)}

/* profile */
.phead{display:flex;align-items:center;gap:14px;margin:16px 16px 0}
.ava{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px dashed var(--line-2);font:700 20px var(--f-ui);color:var(--faint)}
.phead h3{margin:0;font:700 19px var(--f-ui)}
.phead p{margin:2px 0 0;color:var(--sub);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px}
.stats div{padding:12px 6px;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font:700 18px var(--f-ui)}
.stats span{font:500 11px var(--f-ui);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.alert{display:flex;gap:10px;margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);font-size:13px}
.alert b{display:block;color:#7a4500;font-size:13.5px}
.rows{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rows .r{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px}
.rows .r:last-child{border-bottom:0}
.rows .r span:last-child{color:var(--sub);font-size:13px;text-align:right}
.rows details{border-bottom:1px solid var(--line)}
.rows details:last-child{border-bottom:0}
.rows summary{display:flex;justify-content:space-between;padding:13px 14px;font-size:14px;cursor:pointer;list-style:none}
.rows summary::-webkit-details-marker{display:none}
.rows summary::after{content:"›";color:var(--faint);font-size:18px;line-height:1;transition:transform .15s}
.rows details[open] summary::after{transform:rotate(90deg)}
.legal{padding:0 14px 14px;font:400 12.5px/1.55 var(--f-ui);color:var(--sub)}
.legal p{margin:0 0 8px}
.btn-dis{display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:12px;border-radius:12px;border:1px solid var(--line-2);background:transparent;color:var(--faint);font:600 14px var(--f-ui);cursor:not-allowed}
.fine{margin:18px 16px 0;text-align:center;font:400 10.5px var(--f-mono);letter-spacing:.08em;color:var(--faint)}

/* tab bar */
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font:600 10.5px var(--f-ui);color:var(--faint);position:relative}
.tabs button[aria-current="page"]{color:var(--navy)}
.tabs button[aria-current="page"] svg{color:var(--teal)}
.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--haz);color:#fff;font:700 10px/16px var(--f-ui)}

/* detail sheet */
.sheet{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .25s ease-out;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .bar{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 6px;padding-top:max(10px,env(safe-area-inset-top));background:var(--navy);color:#fff}
.sheet .bar button{display:flex;align-items:center;padding:4px 6px;border-radius:8px;color:#fff}
.sheet .bar .ref{flex:1;font:400 12px var(--f-mono);letter-spacing:.12em;color:#8fb0d8}
.sheet .body{flex:1;overflow:auto;scrollbar-width:none;padding-bottom:24px}
.sheet .body::-webkit-scrollbar{display:none}
.dtop{padding:18px 16px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.dtop .cat{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-2)}
.dtop .cat svg{width:16px;height:16px}
.dtop h2{margin:6px 0 10px;font:700 21px/1.25 var(--f-ui)}
.dtop .pay{font:700 30px/1 var(--f-ui);color:var(--navy)}
.dtop .pay small{font:500 13px var(--f-ui);color:var(--sub)}
.client{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.client .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font:700 14px var(--f-ui);flex:none}
.client .av.anon{background:#3b4658}
.client b{display:block;font-size:14px}
.client span{font-size:12.5px;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 16px 0}
.grid2 div{padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.grid2 dt{font:600 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.grid2 dd{margin:2px 0 0;font:500 13.5px/1.35 var(--f-ui)}
.blk{margin:12px 16px 0;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.blk h4{margin:0 0 8px;font:700 13px var(--f-ui);letter-spacing:.04em;color:var(--sub);text-transform:uppercase}
.blk p{margin:0 0 9px;font-size:14.5px;line-height:1.5}
.blk p:last-child{margin:0}
.brk{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.brk span:last-child{white-space:nowrap;text-align:right;font-weight:600}
.brk.fee span:last-child{color:var(--haz)}
.brk.free span:last-child{color:var(--ok)}
.brk.tot{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-weight:700}
.brk.tot span:last-child{color:var(--teal-2);font-size:16px}
.notes{margin:12px 16px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.notes div{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-size:13px;line-height:1.4;background:var(--card);border-bottom:1px solid var(--line)}
.notes div:last-child{border-bottom:0}
.notes svg{width:18px;height:18px;margin-top:1px}
.notes .w{background:var(--warn-bg);color:#7a4500}
.notes .w svg{color:var(--warn)}
.notes .g svg{color:var(--ok)}
.cta{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.cta button{width:100%;padding:14px;border-radius:14px;background:var(--teal);color:#fff;font:700 15px var(--f-ui)}
.cta button.ghost{background:transparent;border:1px solid var(--line-2);color:var(--sub)}
.cta button[disabled]{background:#e2e8f0;color:var(--faint);cursor:not-allowed}
.cta .msg{display:flex;gap:8px;align-items:center;margin-bottom:10px;padding:9px 12px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font:600 13px var(--f-ui)}
.blur{filter:blur(5px);user-select:none}

.toast{position:absolute;left:50%;bottom:84px;z-index:30;transform:translate(-50%,20px);opacity:0;transition:.2s;padding:10px 16px;border-radius:12px;background:var(--navy);color:#fff;font:600 13px var(--f-ui);white-space:nowrap;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app">
 <div class="sbar"><span id="clock">09:41</span><span class="cw">COMMONWEAL NET · TAMSIN</span><span>▂▄▆ ▮</span></div>
 <header class="appbar" id="appbar">
  <div class="brand">
   <svg class="seal" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.5" fill="none" stroke="#6ff3e0" stroke-width="1.2"/><circle cx="17" cy="17" r="12" fill="none" stroke="#6ff3e0" stroke-width=".6" stroke-dasharray="1.5 1.5" opacity=".6"/><path d="M10 13h14M10 17h14M10 21h7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M19 21.5l2 2 3.5-4.5" fill="none" stroke="#6ff3e0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
   <div><div class="wm">LEDGERLINE</div><div class="by">A Commonweal civic service</div></div>
   <span class="sp"></span>
   <div class="bal"><small>Balance</small><b id="bal">0 cr</b></div>
  </div>
  <div class="scrtitle" id="scrtitle"></div>
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" type="search" placeholder="Search gigs at Free Harbor Tamsin" autocomplete="off"></label>
  <div class="guest"><b>GUEST</b><span>Browsing as a guest worker on a registered device</span></div>
 </header>

 <main class="scroll" id="scroll">
  <section class="screen" data-s="gigs">
   <div id="hero"></div>
   <div class="chips" id="chips" role="toolbar" aria-label="Category"></div>
   <div id="feed"></div>
  </section>
  <section class="screen" data-s="mine" hidden>
   <div class="seg" id="seg"><button data-v="req" aria-pressed="true">Requested</button><button data-v="done" aria-pressed="false">Completed</button></div>
   <div id="mine" style="margin-top:14px"></div>
  </section>
  <section class="screen" data-s="wallet" hidden><div id="wallet"></div></section>
  <section class="screen" data-s="me" hidden><div id="me"></div></section>
 </main>

 <nav class="tabs" id="tabs">
  <button data-t="gigs"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="12.5" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/></svg>Gigs</button>
  <button data-t="mine"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16" rx="2.5"/><path d="M9 4.5V3.5h6v1M8.5 13l2.5 2.5 4.5-5"/></svg>My gigs<span class="badge" id="badge" hidden></span></button>
  <button data-t="wallet"><svg class="i" viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16.5" height="11.5" rx="2.5"/><circle cx="16" cy="13.8" r="1.2"/></svg>Wallet</button>
  <button data-t="me"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-3.8 3.8-6 7.5-6s6.7 2.2 7.5 6"/></svg>Profile</button>
 </nav>

 <section class="sheet" id="sheet" aria-live="polite"></section>
 <div class="toast" id="toast"></div>
</div>

<script src="gigs.js"></script>
<script>
(()=>{
const L=window.LEDGERLINE||{profile:{},gigs:[]};
const P=Object.assign({name:"Guest worker",goals:[[10000,"A hull"]],extra:0,unlock:4.5,minRated:3},L.profile);
const G=(L.gigs||[]).map((g,i)=>Object.assign({fee:.2,min:0,status:"open",cr:0,crn:0,notes:[],flags:[],order:i},g));
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
const cr=n=>Math.round(n).toLocaleString("en-US")+" cr";
const take=g=>g.pay*(1-g.fee);
const stars=v=>{const f=Math.round(v);return `<span class="st">${"★".repeat(f)}<span class="o">${"★".repeat(5-f)}</span></span>`};
const initials=s=>String(s).replace(/\(.*?\)/g,"").split(/[\s,·]+/).filter(w=>/^[A-Z]/.test(w)).slice(0,2).map(w=>w[0]).join("")||"?";

/* icons */
const ICON={
 Escort:'<circle cx="9" cy="8" r="3"/><path d="M3.5 19.5c.5-3 2.8-5 5.5-5s5 2 5.5 5"/><path d="M15.5 5.2a3 3 0 0 1 0 5.6M17 14.8c2 .7 3.2 2.4 3.5 4.7"/>',
 Retrieval:'<path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4v4h4"/><path d="M9.5 12h5M12 9.5v5"/>',
 Search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
 Security:'<path d="M12 3.5l7 2.8v5c0 4.6-3 7.8-7 9.2-4-1.4-7-4.6-7-9.2v-5z"/><path d="M9 12l2 2 4-4"/>',
 Labor:'<path d="M14.5 5.5a4 4 0 0 0 4.9 4.9L11 18.8a2.1 2.1 0 0 1-3-3l8.4-8.4"/><path d="M14.5 5.5l2.2-2 4.3 4.3-2 2.2"/>',
 Courier:'<path d="M4 8l8-4 8 4v8.5l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8.5"/>',
 Clinical:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>',
 Civic:'<path d="M6.5 3.5h8l4 4v13h-12z"/><path d="M14 3.5v4.5h4.5M9.5 13h6M9.5 16.5h4"/>',
 warn:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
 ok:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/>',
 lock:'<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 share:'<path d="M12 4v11M7.5 8.5L12 4l4.5 4.5M5 13v5.5h14V13"/>',
 in:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>'};
const ic=(k,cls="i")=>`<svg class="${cls}" viewBox="0 0 24 24">${ICON[k]||ICON.Courier}</svg>`;

/* per-viewer state */
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let req=store.get("ll-req",{});
if(typeof req!=="object"||!req)req={};

/* profile, computed from gigs the GM marked done */
const done=G.filter(g=>g.status==="done");
const rated=done.filter(g=>g.rating>0);
const avg=rated.length?rated.reduce((a,g)=>a+g.rating,0)/rated.length:0;
const shown=rated.length>=P.minRated;
const earnOf=g=>take(g)+(g.bonusPaid&&g.bonus?g.bonus[0]:0);
const earned=done.reduce((a,g)=>a+earnOf(g),0);
const saved=earned+(+P.extra||0);
const locked=g=>g.min>0&&!(shown&&avg>=g.min);
const live=g=>g.status!=="closed";

/* toast */
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2200)}

/* rows */
function row(g){
  const lk=locked(g),dead=g.status==="taken",dn=g.status==="done";
  const tags=[];
  if(dn)tags.push(`<span class="tag ok">✓ Completed${g.rating?` · ${g.rating}★`:""}</span>`);
  else if(dead)tags.push(`<span class="tag">Filled</span>`);
  else if(lk)tags.push(`<span class="tag lock">★ ${g.min}+ only</span>`);
  else if(req[g.id])tags.push(`<span class="tag ok">Requested</span>`);
  if(!lk)tags.push(`<span class="tag">${esc(g.where)}</span>`);
  if(!dn&&!dead&&!lk)tags.push(`<span class="tag">⏱ ${esc(g.expires||"soon")}</span>`);
  if(!lk&&g.flags.some(f=>/below 4\.0/.test(f)))tags.push(`<span class="tag warn">Low-rated client</span>`);
  return `<button class="gig${lk?" locked":""}${dead?" dead":""}" data-id="${esc(g.id)}">
   <span class="ic">${ic(lk?"lock":g.cat)}</span>
   <span class="t">${fmt(g.title)}</span>
   <span class="p">${lk?"0,000 cr":cr(g.pay)}<small>${lk?"":g.fee>0?`you get ${cr(take(g))}`:"no fee"}</small></span>
   <span class="c"><span>${esc(g.client)}</span><span style="white-space:nowrap">${stars(g.cr)} ${g.crn?g.cr.toFixed(1):"new"}</span></span>
   <span class="m">${tags.join("")}</span></button>`;
}
const list=arr=>`<div class="list">${arr.map(row).join("")}</div>`;
const sect=(t,extra="")=>`<div class="sect"><h2>${t}</h2>${extra}</div>`;

/* Gigs screen */
const cats=["All",...new Set(G.filter(g=>live(g)&&g.status!=="done").map(g=>g.cat))];
let cat="All",q="",sort=store.get("ll-sort","rec");
$("#chips").innerHTML=cats.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;$("#chips").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));renderGigs()};
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();renderGigs()};

function renderGigs(){
  const hit=g=>!q||[g.title,g.client,g.blurb,g.where,g.cat].join(" ").toLowerCase().includes(q);
  const vis=G.filter(g=>live(g)&&g.status!=="done"&&(cat==="All"||g.cat===cat)&&hit(g));
  const by={rec:(a,b)=>a.order-b.order,pay:(a,b)=>b.pay-a.pay,stars:(a,b)=>b.cr-a.cr}[sort]||((a,b)=>a.order-b.order);
  const open=vis.filter(g=>g.status==="open"&&!locked(g));
  const feat=open.filter(g=>g.featured)[0];
  $("#hero").innerHTML=feat&&!q&&cat==="All"?`<button class="hero" data-id="${esc(feat.id)}">
    <span class="eb">✦ Matched to your profile</span>
    <h3>${fmt(feat.title)}</h3>
    <div class="cl">${esc(feat.client)} · ${esc(feat.where)}</div>
    <div class="row"><div class="amt">${cr(feat.pay)}${feat.bonus?`<small>+ ${cr(feat.bonus[0])} bonus${feat.fee?"":" · fee paid by client"}</small>`:""}</div><span class="go">View gig</span></div>
    <div class="tags"><span>⏱ Expires ${esc(feat.expires)}</span><span>${esc(feat.posted)}</span></div></button>`:"";
  const rest=open.filter(g=>g!==feat||q||cat!=="All").sort(by);
  const prem=vis.filter(g=>g.status==="open"&&locked(g)).sort(by);
  const filled=vis.filter(g=>g.status==="taken");
  let h=sect("Open near you",`<select id="sort" aria-label="Sort"><option value="rec">Recommended</option><option value="pay">Highest pay</option><option value="stars">Top-rated clients</option></select>`);
  h+=rest.length?list(rest):`<div class="empty"><b>No matching gigs</b>Try another category or search.</div>`;
  if(prem.length)h+=sect("Premium",`<span>★ ${P.unlock}+ profiles</span>`)+list(prem);
  if(filled.length)h+=sect("Recently filled")+list(filled);
  $("#feed").innerHTML=h;
  $("#sort").value=sort;
  $("#sort").onchange=e=>{sort=e.target.value;store.set("ll-sort",sort);renderGigs()};
}

/* My gigs */
let seg="req";
$("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;seg=b.dataset.v;$("#seg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderMine()};
function renderMine(){
  const r=G.filter(g=>req[g.id]&&g.status==="open");
  const arr=seg==="req"?r:done;
  $("#mine").innerHTML=arr.length?list(arr):seg==="req"
    ?`<div class="empty"><b>No requests yet</b>Request a gig and the client will contact you through Ledgerline.</div>`
    :`<div class="empty"><b>No completed gigs</b>Completed gigs and client ratings appear here once settled.</div>`;
  const b=$("#badge");b.hidden=!r.length;b.textContent=r.length;
}

/* Wallet */
function renderWallet(){
  const goals=[...P.goals].sort((a,b)=>a[0]-b[0]),top=goals[goals.length-1][0];
  const pct=Math.min(100,saved/top*100);
  const next=goals.find(m=>saved<m[0]);
  const fees=done.reduce((a,g)=>a+g.pay*g.fee,0);
  $("#wallet").innerHTML=`<div class="wcard"><small>Available balance</small><div class="big">${cr(saved)}</div>
    <div class="num">CW-LL · GUEST · ●●●● ${esc(String(Math.abs([...P.name].reduce((a,c)=>a*31+c.charCodeAt(0),7))%10000).padStart(4,"0"))}</div></div>
   <div class="panel"><h3>Savings goal: a hull</h3><p>${next?`${cr(next[0]-saved)} to go until: ${esc(next[1])}.`:"Every milestone reached. Ledgerline thanks you for your diligence."}</p>
    <div class="prog ms"><i style="width:${pct}%"></i>${goals.map(m=>`<b style="left:${m[0]/top*100}%"></b>`).join("")}</div>
    <div class="mil">${goals.map(m=>`<div class="${saved>=m[0]?"hit":""}"><span>${saved>=m[0]?"✓":"○"} ${esc(m[1])}</span><span>${cr(m[0])}</span></div>`).join("")}</div></div>
   <div class="panel ad"><span class="spon">Sponsored · Commonweal Hull Finance</span><h3>Own a licensed hull from 3,000 cr down</h3>
    <p>Then 280 cr a week for 52 weeks. Approval in one cycle. Guest workers welcome with a co-signer of Tier 3 or above. Missed payments are referred for recovery.</p></div>
   ${P.extra?`<div class="panel"><div class="brk"><span>Ledgerline settlements</span><span>${cr(earned)}</span></div><div class="brk"><span>Other deposits</span><span>${cr(P.extra)}</span></div></div>`:""}
   ${sect("Settlements",done.length?`<span>Fees to date ${cr(fees)}</span>`:"")}
   ${done.length?`<div class="list">${done.map(g=>`<div class="tx"><span class="ic">${ic("in")}</span><div><div class="t">${fmt(g.title)}</div><div class="d">${esc(g.id)} · ${esc(g.client)}</div></div>
     <div class="a">+${cr(earnOf(g))}${g.fee?`<small>fee −${cr(g.pay*g.fee)}</small>`:""}</div></div>`).join("")}</div>`
    :`<div class="empty"><b>No settlements yet</b>Pay from completed gigs settles here, less the facilitation fee.</div>`}`;
}

/* Profile */
function renderMe(){
  $("#me").innerHTML=`<div class="phead"><div class="ava">${esc(initials(P.name)||"G")}</div><div><h3>${esc(P.name)}</h3><p>${shown?`${stars(avg)} ${avg.toFixed(2)}`:"Unrated"} · Free Harbor Tamsin</p></div></div>
   <div class="stats"><div><b>${done.length}</b><span>Gigs</span></div><div><b>${shown?avg.toFixed(1):"—"}</b><span>Rating</span></div><div><b>20%</b><span>Fee</span></div></div>
   <div class="panel"><h3>${shown&&avg>=P.unlock?"Premium unlocked":"Unlock Premium gigs"}</h3>
    <p>${shown?`Premium gigs are shown to profiles rated ★ ${P.unlock} and above.`:`Complete ${P.minRated} rated gigs to receive a rating. Premium gigs are shown at ★ ${P.unlock}+.`}</p>
    <div class="prog gold"><i style="width:${shown?Math.min(100,avg/P.unlock*100):rated.length/P.minRated*100}%"></i></div>
    <div class="pl"><span>${shown?`★ ${avg.toFixed(2)}`:`${rated.length} of ${P.minRated} rated gigs`}</span><span>★ ${P.unlock}</span></div></div>
   <div class="alert">${ic("warn")}<div><b>Registered device</b>This device is registered to ${esc(P.device||"another holder")}. ${esc(P.holder||"")} Ratings earned on a guest profile are held for 30 days.</div></div>
   <button class="btn-dis" disabled>Sign in as registered holder · suspended</button>
   <div class="rows">
    <div class="r"><span>Citizenship tier</span><span>None on file</span></div>
    <div class="r"><span>Worker category</span><span>Guest (non-citizen)</span></div>
    <div class="r"><span>Facilitation fee</span><span>20% of posted pay</span></div>
    <div class="r"><span>Port of work</span><span>Free Harbor Tamsin · DRF-01</span></div>
    <details><summary>Terms of service</summary><div class="legal">
     <p>Ledgerline is operated under Commonweal license CW-LL-0044 at all ports where Commonweal maintains a records presence.</p>
     <p>Facilitation fee: 20% of posted pay for non-citizen and guest workers; 12% for citizens of Tier 3 and above. Fees are deducted at settlement.</p>
     <p>Ratings are final. Ledgerline may weight a worker's rating by factors it is not required to disclose.</p>
     <p>Ledgerline does not verify listings beyond automated review. Disputes resolve under the Arbitration Clause. Persons with unresolved obligations may find some gigs unavailable.</p></div></details>
    <details><summary>Help and support</summary><div class="legal"><p>Support is available to citizens of Tier 2 and above. Guest workers may consult the Terms of service.</p></div></details>
   </div>
   <p class="fine">LEDGERLINE 4.12 · COMMONWEAL CIVIC SERVICES<br>EVERY OBLIGATION, MET.</p>`;
}

/* gig detail */
let cur=null;
function renderSheet(){
  const g=G.find(x=>x.id===cur), sh=$("#sheet");
  if(!g){sh.classList.remove("open");return}
  const lk=locked(g),dead=g.status==="taken",dn=g.status==="done";
  const anon=/withheld/i.test(g.client);
  const brk=lk?"":`<div class="blk"><h4>Pay</h4>
    <div class="brk"><span>Posted pay</span><span>${cr(g.pay)}</span></div>
    ${g.fee>0?`<div class="brk fee"><span>Facilitation fee (${Math.round(g.fee*100)}%)</span><span>−${cr(g.pay*g.fee)}</span></div>`:`<div class="brk free"><span>Facilitation fee</span><span>Paid by client</span></div>`}
    ${g.bonus?`<div class="brk"><span>Bonus, ${esc(g.bonus[1])}</span><span>+${cr(g.bonus[0])}</span></div>`:""}
    <div class="brk tot"><span>You take home</span><span>${g.bonus?`${cr(take(g))} – ${cr(take(g)+g.bonus[0])}`:cr(take(g))}</span></div></div>`;
  const flags=lk||dn||dead?[]:g.flags.length?g.flags:["This listing passed automated review."];
  const notes=flags.length?`<div class="notes">${flags.map(f=>{const good=/passed automated review/.test(f);return `<div class="${good?"g":"w"}">${ic(good?"ok":"warn")}<span>${fmt(f)}</span></div>`}).join("")}</div>`:"";
  let cta;
  if(dn)cta=`<div class="msg">${ic("ok")}Completed and settled${g.rating?` · rated ${g.rating}★`:""}</div>`;
  else if(dead)cta=`<button disabled>Filled by another worker</button>`;
  else if(lk)cta=`<button disabled>${"🔒"} Requires ★ ${g.min}</button>`;
  else if(req[g.id])cta=`<div class="msg">${ic("ok")}Requested ${esc(req[g.id])} · the client will contact you</div><button class="ghost" data-do="withdraw">Withdraw request</button>`;
  else cta=`<button data-do="request">Request gig · ${g.bonus?"up to "+cr(take(g)+g.bonus[0]):cr(take(g))}</button>`;
  sh.innerHTML=`<div class="bar"><button data-do="back" aria-label="Back">${ic("back")}</button><span class="ref">${esc(g.id)}</span><button data-do="share" aria-label="Copy link">${ic("share")}</button></div>
   <div class="body">
    <div class="dtop"><span class="cat">${ic(g.cat)}${esc(g.cat)} · posted ${esc(g.posted||"")}</span>
     <h2>${fmt(g.title)}</h2>
     <div class="pay ${lk?"blur":""}">${lk?"0,000 cr":cr(g.pay)}${g.bonus&&!lk?` <small>+ ${cr(g.bonus[0])} bonus</small>`:""}</div></div>
    <div class="client"><span class="av${anon?" anon":""}">${anon?"?":esc(initials(g.client))}</span><div><b>${esc(g.client)}</b><span>${stars(g.cr)} ${g.cr.toFixed(1)} · ${g.crn?`${g.crn.toLocaleString("en-US")} reviews`:"no reviews yet"}</span></div></div>
    <dl class="grid2"><div><dt>Where</dt><dd>${esc(g.where)}</dd></div><div><dt>When</dt><dd>${esc(g.when||"—")}</dd></div>
     <div><dt>Expires</dt><dd>${esc(g.expires||"—")}</dd></div><div><dt>Eligible</dt><dd>${g.min?`★ ${g.min}+ profiles`:"Any profile"}</dd></div></dl>
    ${notes}
    <div class="blk"><h4>About this gig</h4>${lk?`<p style="color:var(--sub)">Full listing visible to Premium profiles (★ ${g.min}+). Complete gigs and earn five-star ratings to unlock.</p>`:`<p>${fmt(g.blurb)}</p>${g.notes.map(n=>`<p>${fmt(n)}</p>`).join("")}`}</div>
    ${brk}
   </div>
   <div class="cta">${cta}</div>`;
  sh.classList.add("open");sh.querySelector(".body").scrollTop=0;
}
$("#sheet").onclick=e=>{const b=e.target.closest("[data-do]");if(!b)return;const d=b.dataset.do;
  if(d==="back"){go(tab==="gigs"?"":tab);return}
  if(d==="share"){const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("Link copied"),()=>toast(u));return}
  if(d==="request"){req[cur]=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});store.set("ll-req",req);toast("Request sent to client")}
  if(d==="withdraw"){delete req[cur];store.set("ll-req",req);toast("Request withdrawn")}
  renderAll();renderSheet();
};
document.addEventListener("click",e=>{const c=e.target.closest(".gig,.hero");if(c&&c.dataset.id)go(c.dataset.id)});

/* tabs + routing */
let tab="gigs";
const TITLES={mine:"My gigs",wallet:"Wallet",me:"Profile"};
$("#tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b)go(b.dataset.t==="gigs"?"":b.dataset.t)};
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
function setTab(t){
  if(t!==tab){tab=t;$("#scroll").scrollTop=0}
  document.querySelectorAll(".screen").forEach(s=>s.hidden=s.dataset.s!==t);
  $("#tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===t?"page":"false"));
  $("#appbar").classList.toggle("title-only",t!=="gigs");
  $("#scrtitle").textContent=TITLES[t]||"";
}
function renderAll(){$("#bal").textContent=cr(saved);renderGigs();renderMine();renderWallet();renderMe()}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(G.some(g=>g.id===h)){cur=h;renderSheet();return}
  cur=null;renderSheet();
  setTab(TITLES[h]?h:"gigs");
}
addEventListener("hashchange",route);
addEventListener("keydown",e=>{if(e.key==="Escape"&&cur)go(tab==="gigs"?"":tab)});
const tick=()=>{$("#clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};tick();setInterval(tick,30000);
renderAll();route();
})();
</script>
</body></html>
