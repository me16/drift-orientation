# Deploys the site to Firebase Hosting (project drift-combat) whenever main changes,
# so the Firebase copy never lags GitHub Pages. Run it by hand from the Actions tab too.
# Needs one repo secret: FIREBASE_SERVICE_ACCOUNT, the JSON key from Firebase console →
# Project settings → Service accounts → Generate new private key.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret is set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repo secret (Settings → Secrets and variables → Actions). See the comment at the top of this workflow."
            exit 1
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: drift-combat
          channelId: live
